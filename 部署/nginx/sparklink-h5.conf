# Spark Link：H5 静态站 + /api/ 反代（生产 ECS）
# 安装: 由 scripts/deploy-prod.sh 同步到 /etc/nginx/conf.d/sparklink.conf

upstream sparklink_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# 公网 IP 直访：仅暴露 API，页面引导到 HTTPS 域名
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 6m;

    location ^~ /api/ {
        proxy_pass http://sparklink_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        return 302 https://www.aipick.cloud$request_uri;
    }
}

# 域名 HTTP → HTTPS
server {
    listen 80;
    server_name www.aipick.cloud aipick.cloud h5.aipick.cloud;

    return 301 https://$host$request_uri;
}

# 域名 HTTPS：H5 静态 + API 反代
server {
    listen 443 ssl;
    server_name www.aipick.cloud aipick.cloud h5.aipick.cloud;

    ssl_certificate     /etc/nginx/ssl/www.aipick.cloud.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aipick.cloud.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    root /var/www/sparklink-h5;
    index index.html;

    client_max_body_size 6m;

    location ^~ /api/ {
        proxy_pass http://sparklink_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 仅缓存 H5 静态资源；勿匹配 /api/ 下图片（由后端 /api/static 提供）
    location ~* ^/(?!api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
