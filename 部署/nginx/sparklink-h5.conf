# Spark Link H5 静态站 + API 反代（阿里云 ECS Nginx）
# 安装: 复制到 /etc/nginx/conf.d/sparklink-h5.conf 后 nginx -t && systemctl reload nginx
# 证书: 使用 certbot 或阿里云 SSL 绑定 443

upstream sparklink_api {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name www.aipick.cloud aipick.cloud h5.aipick.cloud;
    # 生产请 redirect 到 HTTPS
    # return 301 https://$host$request_uri;

    root /var/www/sparklink-h5;
    index index.html;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://sparklink_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

