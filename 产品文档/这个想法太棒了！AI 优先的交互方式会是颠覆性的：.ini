### 首页功能矩阵

| 功能 | 说明 |
|------|------|
| 🤖 AI 对话入口 | 自然语言表达需求，AI 理解并执行 |
| 🎯 智能推荐 | 基于兴趣/位置/圈子智能推荐 |
| 📍 附近动态 | LBS 推荐附近搭子/活动 |
| 🔥 热门活动 | 平台热门活动推荐 |
| 💬 AI 破冰 | 根据匹配生成破冰话题 |

---

### 对话示例

**用户输入**：
> "这周末想打羽毛球，在望京附近，最好是同事圈"

**AI 响应**：
> 🎯 找到 **4** 个合适的搭子：
> 
> | 搭子 | 匹配度 | 范围 | 位置 |
> |------|--------|------|------|
> | 小王 | 92% | 同事-字节 | 望京 SOHO |
> | 李姐 | 88% | 同事-美团 | 望京 CBD |
> | 张哥 | 85% | 同事-阿里 | 望京科技 |
> 
> [查看详情] [发起搭子邀请]

---

### 技术实现

```
用户输入 → AI 意图识别 → 参数提取 → 检索匹配 → 个性化排序 → 返回结果
   ↓
自然语言 → NLU/意图   → 实体    → ES/MySQL  → LLM 重排    → 生成回复
```

---

### 颠覆性特点

1. **无菜单导航** - 一切通过对话完成
2. **懂你所需** - AI 记住你的偏好
3. **主动推荐** - 不是等用户搜索，而是 AI 主动推荐
4. **零门槛** - 不用学筛选器，说话就行

