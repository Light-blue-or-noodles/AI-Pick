# 生产环境配置（与 DEPLOY-GUIDE-ALIYUN.md 配合使用）
# 通过环境变量注入：DB_PASSWORD, JWT_SECRET, DASHSCOPE_API_KEY, WECHAT_APPID, WECHAT_SECRET

app:
  allow-test-login: false
  im-batch-import-secret: ${IM_BATCH_IMPORT_SECRET:}

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    connection-timeout: 20000

spring:
  application:
    name: sparklink-backend
  web:
    locale: zh_CN
    servlet:
      encoding:
        enabled: true
        charset: UTF-8
        force: true
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sparklink?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 50
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 20
          min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sparklink.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

logging:
  level:
    com.sparklink: info
    org.springframework: warn
  file:
    name: /var/log/sparklink/backend.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 与小程序 appid 一致；AppSecret 仅可通过环境变量或 .env 注入，勿写死到仓库
wechat:
  appid: ${WECHAT_APPID:wx4bdbaf380a183caa}
  secret: ${WECHAT_SECRET:}

upload:
  dir: uploads
  avatar-subdir: avatars

storage:
  type: local
  local:
    root-dir: ${upload.dir:uploads}

# 腾讯云 IM（生产环境必须注入，勿在文件中写密钥）
tencent:
  im:
    sdk-app-id: ${TENCENT_IM_SDK_APP_ID}
    identifier: ${TENCENT_IM_IDENTIFIER:}
    key: ${TENCENT_IM_KEY}
    expire-seconds: ${TENCENT_IM_EXPIRE_SECONDS:604800}
    rest-api-host: ${TENCENT_IM_REST_HOST:https://console.tim.qq.com}
    # account_import 的 FaceUrl 须为腾讯云可访问的 HTTPS；默认与线上 API 域名一致（含 /api，后接 /static/...）
    avatar-public-base-url: ${TENCENT_IM_AVATAR_PUBLIC_BASE:https://www.aipick.cloud/api}
    # 若线上误将 TENCENT_IM_AVATAR_PUBLIC_BASE 配成 http://IP:8080/api，仍用此处 HTTPS 域名写 IM FaceUrl
    avatar-public-https-base: ${TENCENT_IM_AVATAR_PUBLIC_HTTPS:https://www.aipick.cloud/api}
