server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

# 小程序「测试账号」登录：需真实 JWT 才能调用 /api/im/usersig；生产环境务必关闭（见 application-prod.yml）
# IM 批量导入：POST /api/im/admin/batch-import-users，请求头 X-Im-Batch-Secret；生产务必设强密钥（勿提交仓库）
app:
  allow-test-login: ${ALLOW_TEST_LOGIN:true}
  im-batch-import-secret: ${IM_BATCH_IMPORT_SECRET:}

spring:
  application:
    name: aipick-backend
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  web:
    locale: zh_CN
    servlet:
      encoding:
        enabled: true
        charset: UTF-8
        force: true
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aipick?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aipick.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置（本地未设置 JWT_SECRET 时使用默认值，生产环境请设置环境变量）
jwt:
  secret: ${JWT_SECRET:aipick-dev-secret-change-in-production}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# 日志配置
logging:
  level:
    com.aipick: debug
    org.springframework: info
# 微信小程序登录（code2Session 需 AppID + AppSecret）
# AppSecret 只在微信公众平台查看，务必用环境变量 WECHAT_SECRET 注入，勿写入仓库
# 与本仓库小程序 project.config.json 中 appid 保持一致时可不设置 WECHAT_APPID
wechat:
  appid: ${WECHAT_APPID:wx4bdbaf380a183caa}
  secret: ${WECHAT_SECRET:}

# 头像等上传文件保存目录。代码中会转为绝对路径，与静态资源访问一致；若仍报 FileNotFoundException，可改为绝对路径如 ${user.dir}/uploads
upload:
  dir: uploads
  avatar-subdir: avatars

# 图片存储：local 为默认（写入 upload 目录）；后续可改为 oss 并接入 ImageStorageService 的 OSS 实现
storage:
  type: local
  local:
    root-dir: ${upload.dir:uploads}

# 腾讯云即时通信 IM（UserSig 仅在后端签发；密钥勿提交公开仓库，生产务必用环境变量覆盖）
tencent:
  im:
    sdk-app-id: ${TENCENT_IM_SDK_APP_ID:1600133993}
    # 控制台「账号管理」中设为管理员(App 管理员)的 UserID，用于 REST 导入账号；须与控制台一致
    identifier: ${TENCENT_IM_IDENTIFIER:administrator}
    key: ${TENCENT_IM_KEY:8806e0cd94d52d2d5a1d6d3f9e47253b8274de8cf262ee66961dcbe154cead64}
    expire-seconds: ${TENCENT_IM_EXPIRE_SECONDS:604800}
    rest-api-host: ${TENCENT_IM_REST_HOST:https://console.tim.qq.com}
    # 库内相对路径 /static/... 拼 FaceUrl 时使用；须与小程序访问后端的本机 IP 一致（见 app.js LAN_IP）。
    # 微信头像等为 https 完整链时可直接同步到 IM；腾讯云服务器无法访问纯内网 IP 时本站上传头像仅小程序端可见。
    avatar-public-base-url: ${TENCENT_IM_AVATAR_PUBLIC_BASE:http://192.168.1.173:8080/api}
